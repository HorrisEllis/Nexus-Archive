<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab — Clear Glass</title>
<style>
  :root{
    --bg:#08080d; --s1:#0e0e16; --border:#1a1a26; --text:#c8ccd6;
    --muted:#5a5f70; --accent:#00e5ff; --accent-dim:rgba(0,229,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:'SF Mono','Fira Code',monospace;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  .mark{font-size:13px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .2s}
  .dot.ok{background:#22c55e}
  .dot.off{background:#ef4444}
  .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:640px}
  .links a{
    display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;
    border:0.5px solid var(--border);background:var(--s1);color:var(--text);
    text-decoration:none;font-size:12px;transition:border-color .12s,background .12s;
  }
  .links a:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
  .hint{font-size:10px;color:var(--muted);max-width:420px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="mark">⬡ Clear Glass</div>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">Checking NEXUS…</span></div>
  <div class="links">
    <a href="http://127.0.0.1:9000/ui/home/index.html">NEXUS Home</a>
    <a href="https://claude.ai/new">Claude</a>
    <a href="https://chatgpt.com">ChatGPT</a>
    <a href="https://gemini.google.com">Gemini</a>
    <a href="https://www.perplexity.ai">Perplexity</a>
  </div>
  <div class="hint">
    This is a local page — nothing was requested from the network.
    Press ⌘/Ctrl+L or click the address bar to navigate.
  </div>

<script>
  // §NEW 2026-07-02: replaces the blank about:blank / stuck-on-a-dead-URL
  // "new tab" — every new tab used to default to whatever defaultStartUrl
  // was set to (often the orchestrator's UI), and with NEXUS not running
  // that rendered as a plain black screen with no explanation. This page
  // is local (file://), always loads instantly, and tells you what's up.
  fetch('http://127.0.0.1:9000/health', { signal: AbortSignal.timeout(2000) })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(() => {
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('status-text').textContent = 'NEXUS online (:9000)';
    })
    .catch(() => {
      document.getElementById('dot').className = 'dot off';
      document.getElementById('status-text').textContent = 'NEXUS offline — start the orchestrator to use NEXUS Home';
    });
</script>
</body>
</html>
