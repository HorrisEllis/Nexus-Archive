<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS · CONVERSATIONS</title>
<link rel="stylesheet" href="/ui/home/home.css">
<style>
  /* §SOVEREIGN CHANNEL 2026-07-11 — this channel is a standalone document,
     openable and testable on its own (DECOMP.md benefit #3). It reuses
     home.css for design tokens + existing component classes (.sys-tile,
     .ch, etc.) rather than forking them, so it always matches the shell's
     look without duplicating hundreds of class definitions. */
  html,body{margin:0;padding:0;background:transparent;color:var(--text,#e8eef7);font-family:'Space Grotesk',sans-serif;height:100%}
  .ch{display:block!important;position:static!important;width:100%;height:100%;animation:none!important}
  .channel-root{padding:16px;height:100%;box-sizing:border-box;overflow:auto}
</style>
</head>
<body>
<div class="channel-root">
<div class="ch" id="ch-conversations">
    <div style="display:flex;gap:10px;margin-bottom:8px;align-items:center;flex-shrink:0;padding:0 4px">
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em">Conversations</span>
      <span id="conv-count" style="font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,.2)">0 exchanges</span>
      <select id="conv-filter" onchange="convLoad()" style="margin-left:auto;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:rgba(255,255,255,.6);font-family:'Space Mono',monospace;font-size:9px;padding:3px 6px;outline:none">
        <option value="">All providers</option>
        <option value="copilot">Co-pilot</option>
        <option value="claude">Claude NCP</option>
        <option value="chatgpt">ChatGPT NCP</option>
        <option value="ollama">Ollama</option>
      </select>
      <button class="btn" onclick="convLoad()" style="font-size:9px;padding:4px 10px">↺ Refresh</button>
    </div>
    <div id="conv-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 2px"></div>
  </div>
</div>
<script src="/ui/lib/api.js"></script>
<script>
'use strict';
// §API base ports — same map home/index.html uses (P{...}), duplicated
// here on purpose: a sovereign channel must not depend on the shell's
// global scope existing (it may be opened standalone, per DECOMP.md).
const P={orch:9000,gd:7820,cx:3748,br:9999,idr:4800,em:4242,arch:3747,dg:7825};
const B={orch:`http://127.0.0.1:${P.orch}`,gd:`http://127.0.0.1:${P.gd}`,cx:`http://127.0.0.1:${P.cx}`,br:`http://127.0.0.1:${P.br}`,idr:`http://127.0.0.1:${P.idr}`,em:`http://127.0.0.1:${P.em}`,arch:`http://127.0.0.1:${P.arch}`,dg:`http://127.0.0.1:${P.dg}`};

async function convLoad() {
  const filter = document.getElementById('conv-filter')?.value || '';
  const list   = document.getElementById('conv-list');
  if (!list) return;
  list.innerHTML = '<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:rgba(255,255,255,.2);padding:16px">Loading…</div>';

  try {
    const url = `http://127.0.0.1:${P.orch}/api/memory?table=chat_log&limit=40`;
    const d = await fetch(url).then(r=>r.json()).catch(()=>null);
    const rows = (d?.rows || d?.result || []).filter(r => !filter || r.provider===filter || r.source===filter)
      .sort((a,b)=>(b.ts||0)-(a.ts||0));

    document.getElementById('conv-count').textContent = `${rows.length} exchanges`;

    if (!rows.length) {
      list.innerHTML = '<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:rgba(255,255,255,.2);padding:16px">No conversations yet. Try asking co-pilot something.</div>';
      return;
    }

    list.innerHTML = '';
    rows.forEach(row => {
      const ago = _convAgo(row.ts);
      const provider = row.provider || row.source || 'unknown';
      const intent   = row.intent || '—';
      const model    = row.modelUsed || row.model || '';
      const channel  = row.channel || '';
      const prompt   = (row.prompt || '').slice(0, 300);
      const response = (row.response || '').slice(0, 400);

      const card = document.createElement('div');
      card.className = 'conv-card';
      const badgeClass = ['copilot','claude','chatgpt','ollama'].includes(provider) ? provider : 'copilot';

      card.innerHTML = `
        <div class="conv-card-head">
          <span class="conv-badge ${badgeClass}">${provider}</span>
          ${intent!=='—'?`<span class="conv-intent">${intent}</span>`:''}
          ${channel?`<span class="conv-intent" style="color:rgba(255,255,255,.18)">${channel}</span>`:''}
          <span class="conv-ts" style="margin-left:auto">${ago}</span>
        </div>
        <div class="conv-prompt">${_escHtml(prompt)}</div>
        ${response?`
          <div class="conv-response" id="cr-${row.uuid}">${_escHtml(response)}${response.length>=400?'…':''}</div>
          ${response.length>100?`<span class="conv-expand" onclick="this.previousElementSibling.classList.toggle('expanded');this.textContent=this.textContent==='▼ expand'?'▲ collapse':'▼ expand'">▼ expand</span>`:''}
        `:''}
        ${model?`<div style="font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,.18);margin-top:6px">via ${model}${row.fromGrammar?' · grammar-routed':''}</div>`:''}
      `;
      list.appendChild(card);
    });
  } catch(e) {
    list.innerHTML = `<div style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--err);padding:16px">Error: ${e.message}</div>`;
  }
}

function _convAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now()-ts)/1000);
  if (s<60) return `${s}s ago`;
  if (s<3600) return `${Math.round(s/60)}m ago`;
  return `${Math.round(s/3600)}h ago`;
}

function _escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── init ──────────────────────────────────────────────────────────────────
try { convLoad(); } catch(e) { console.warn('[channel:conversations] init failed:', e.message); }

// ── this channel's own SSE subscription — sovereign, not dependent on the
//    shell's single connection (matches DECOMP.md's "each channel can be
//    opened independently... for debugging"). Shell-embedded use can still
//    layer postMessage on top later without this needing to change. ──────
try {
  const es = new EventSource(`${B.orch}/sse`);
  es.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (typeof window.onChannelEvent === 'function') window.onChannelEvent(d);
    } catch(_) {}
  };
  es.onerror = () => { /* orchestrator not reachable — channel still renders, just static until it is */ };
} catch(_) {}
</script>
</body>
</html>
