<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORTEX — the brain of NEXUS</title>
<!--
  ui/cortex/index.html — CORTEX BRAIN v2.0.0
  component_id: ui.cortex.brain · 2026-07-05
  Replaces the tabbed v1 (preserved at index.html.pre-brain.bak).

  The brain IS the CFR field, rendered:
    coherence → pulse rate + green luminance      friction → rotational drag
    tension   → red shift + particle jitter       entropy  → cortical scatter
    resonance → ambient synapse firing rate       regime   → global hue state
  System nuclei (12) light with real online status (:9000/api/status).
  Live events (:9000/sse) fire synapse bursts from their source nucleus.

  Every fetch degrades gracefully — a dead route greys its panel, never
  blanks the brain. SSE reconnect uses real backoff (3s→30s, reset only
  after 10s stable) — the lesson from the userscript flapping storm,
  applied here from day one instead of re-learned later.
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--void:#04080a;--panel:rgba(10,18,22,.82);--border:#1a2830;--border2:#243848;
--green:#00ff88;--green2:#00cc6a;--cyan:#00e5ff;--amber:#ffaa00;--red:#ff3355;--violet:#b26bff;
--text:#d0f0e8;--text2:#7aa898;--text3:#3a6055;--mono:'Space Mono',monospace;--ui:'Space Grotesk',sans-serif}
html,body{height:100%;background:var(--void);color:var(--text);font-family:var(--ui);overflow:hidden}
#gl{position:fixed;inset:0;z-index:0}
.hud{position:fixed;z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}

/* ── top bar ── */
#top{top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;
background:linear-gradient(180deg,rgba(4,8,10,.92),rgba(4,8,10,.55) 80%,transparent);}
#glyph{font-size:20px;color:var(--green);animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.45}50%{opacity:1;filter:drop-shadow(0 0 12px var(--green))}}
.title{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--green)}
.title small{color:var(--text3);font-weight:400;letter-spacing:.08em}
#regime{font-family:var(--mono);font-size:10px;padding:3px 12px;border-radius:20px;border:1px solid;letter-spacing:.1em}
#chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:12px;border:1px solid var(--border2);
color:var(--text3);display:flex;align-items:center;gap:5px;background:rgba(4,8,10,.5)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.chip.on{color:var(--text2);border-color:rgba(0,255,136,.25)}.chip.on .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.chip.off .dot{background:var(--red)}

/* ── panels ── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px);
overflow:hidden;transition:all .25s;max-height:520px;display:flex;flex-direction:column}
.panel.min{max-height:34px}
.phead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);
font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text2);
text-transform:uppercase;cursor:pointer;user-select:none;flex-shrink:0}
.phead .st{margin-left:auto;font-size:8px;font-weight:400;color:var(--text3)}
.panel.min .pbody{display:none}
.pbody{padding:10px 12px;overflow-y:auto;font-size:11px}
.pbody::-webkit-scrollbar{width:5px}.pbody::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#left{top:56px;left:12px;width:270px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 200px)}
#right{top:56px;right:12px;width:300px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 200px)}
#bottom{bottom:12px;left:12px;right:12px;height:128px}
#bottom .panel{height:100%;max-height:none}

/* ── CFR gauges ── */
.gauge{margin-bottom:9px}
.glbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--text3);
text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.glbl b{color:var(--text2)}
.gbar{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.gfill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1),background .8s}

/* ── intelligence ── */
.iin{display:flex;gap:6px;margin-bottom:8px}
input,textarea{background:rgba(4,8,10,.7);border:1px solid var(--border);border-radius:7px;color:var(--text);
font-family:var(--ui);font-size:11px;padding:7px 10px;outline:none;width:100%;transition:border-color .2s}
input:focus{border-color:var(--green2)}
.btn{padding:6px 11px;border-radius:7px;border:1px solid var(--border2);background:rgba(0,255,136,.06);
color:var(--green);font-family:var(--mono);font-size:9px;cursor:pointer;white-space:nowrap;letter-spacing:.05em}
.btn:hover{border-color:var(--green);background:rgba(0,255,136,.12)}
.btn.alt{color:var(--violet);background:rgba(178,107,255,.06)}.btn.alt:hover{border-color:var(--violet)}
.ians{font-size:11px;color:var(--text2);line-height:1.55;background:rgba(4,8,10,.5);border-left:2px solid var(--green2);
padding:8px 10px;border-radius:0 7px 7px 0;margin-bottom:8px;white-space:pre-wrap;max-height:150px;overflow-y:auto}
.ians.mm{border-left-color:var(--violet)}
.ians:empty{display:none}
.ilist{font-family:var(--mono);font-size:9.5px;color:var(--text3);line-height:1.7;max-height:110px;overflow-y:auto}
.ilist b{color:var(--text2)}

/* ── memory ── */
.tsel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tchip{font-family:var(--mono);font-size:8.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--border2);
color:var(--text3);cursor:pointer}
.tchip.on{color:var(--cyan);border-color:var(--cyan)}
.mrows{font-family:var(--mono);font-size:9px;color:var(--text2);line-height:1.6;max-height:170px;overflow-y:auto;word-break:break-all}
.mrow{padding:3px 0;border-bottom:1px solid rgba(26,40,48,.55)}
.mrow .k{color:var(--text3)}

/* ── gaps ── */
.gap{border-left:2px solid var(--amber);padding:5px 9px;margin-bottom:5px;background:rgba(4,8,10,.45);border-radius:0 6px 6px 0}
.gap.high{border-left-color:var(--red)}
.gap .gt{font-family:var(--mono);font-size:8.5px;color:var(--text3);text-transform:uppercase}
.gap .gb{font-size:10.5px;color:var(--text2)}

/* ── event stream ── */
#evs{display:flex;flex-direction:column-reverse;overflow-y:auto;height:100%;font-family:var(--mono);font-size:9.5px}
.ev{display:flex;gap:10px;padding:2px 0;border-bottom:1px solid rgba(26,40,48,.4);animation:evin .3s ease}
@keyframes evin{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.ev .ts{color:var(--text3);flex-shrink:0}
.ev .src{flex-shrink:0;min-width:92px;font-weight:700}
.ev .ty{color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ssest{font-size:8px;color:var(--text3);font-weight:400}

/* hint */
#hint{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);z-index:1;font-family:var(--mono);
font-size:9px;color:var(--text3);letter-spacing:.1em;pointer-events:none;opacity:.6}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud" id="top">
  <span id="glyph">⬡</span>
  <span class="title">CORTEX <small>· the brain of NEXUS · ui.cortex.brain v2.0.0</small></span>
  <span id="regime" style="color:var(--green);border-color:rgba(0,255,136,.35)">STABLE</span>
  <div id="chips"></div>
</div>

<div class="hud" id="left">
  <div class="panel" id="p-cfr">
    <div class="phead" onclick="togglePanel('p-cfr')">CFR Field <span class="st" id="cfr-ts">—</span></div>
    <div class="pbody" id="cfr-body"></div>
  </div>
  <div class="panel" id="p-int">
    <div class="phead" onclick="togglePanel('p-int')">Intelligence <span class="st" id="int-st">—</span></div>
    <div class="pbody">
      <div class="iin">
        <input id="iq" placeholder="ask intuition… (Enter)" onkeydown="if(event.key==='Enter')askIntuition()">
        <button class="btn alt" onclick="askMastermind()" title="causal analysis of the same prompt">MM</button>
      </div>
      <div class="ians" id="ians"></div>
      <div class="ians mm" id="mmans"></div>
      <div class="glbl"><span>Patterns</span><b id="patc">—</b></div>
      <div class="ilist" id="patterns">loading…</div>
      <div class="glbl" style="margin-top:8px"><span>Root causes</span><b id="rcac">—</b></div>
      <div class="ilist" id="rca">loading…</div>
    </div>
  </div>
</div>

<div class="hud" id="right">
  <div class="panel" id="p-mem">
    <div class="phead" onclick="togglePanel('p-mem')">JAA Memory <span class="st" id="mem-st">—</span></div>
    <div class="pbody">
      <div class="tsel" id="tsel"></div>
      <div class="mrows" id="mrows">select a table</div>
    </div>
  </div>
  <div class="panel" id="p-gaps">
    <div class="phead" onclick="togglePanel('p-gaps')">Gaps <span class="st" id="gap-st">—</span></div>
    <div class="pbody" id="gaps">loading…</div>
  </div>
</div>

<div class="hud" id="bottom">
  <div class="panel">
    <div class="phead" style="cursor:default">Live Event Stream <span class="st" id="ssest">connecting…</span></div>
    <div class="pbody" style="padding:6px 12px;flex:1;overflow:hidden"><div id="evs"></div></div>
  </div>
</div>

<div id="hint">drag: orbit · wheel: zoom · click nucleus: focus system</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ══════════ endpoints ══════════ */
const CX='http://localhost:3748', ORCH='http://localhost:9000';
const j=async(u,opt)=>{const r=await fetch(u,opt);return r.json();};
const esc=s=>String(s).replace(/</g,'&lt;');

/* ══════════ system map — 12 nuclei, stable anatomical seats ══════════ */
const SYSTEMS={
  cortex:      {c:0x00ff88,p:[   0, .55,   0],label:'CORTEX'},       // crown — this system
  orchestrator:{c:0x00e5ff,p:[   0, .10, .95],label:'ORCH'},         // frontal — executive
  guardian:    {c:0xffaa00,p:[   0,-.35, .55],label:'GUARDIAN'},     // limbic — protection
  bridge:      {c:0xb26bff,p:[   0,-.15,-.15],label:'BRIDGE'},       // corpus callosum — relay
  copilot:     {c:0x00e5ff,p:[ .55, .30, .55],label:'COPILOT'},      // right frontal
  idearium:    {c:0xff6bd6,p:[-.55, .30, .55],label:'IDEARIUM'},     // left frontal — ideas
  architect:   {c:0x6bff8f,p:[-.62, .18,-.25],label:'ARCHITECT'},    // left parietal — structure
  loom:        {c:0x6bd0ff,p:[ .62, .18,-.25],label:'LOOM'},         // right parietal — weaving
  eravos:      {c:0xffd86b,p:[ .48,-.10,-.72],label:'ERAVOS'},       // right occipital — canvas
  ollama:      {c:0x9dff6b,p:[-.48,-.10,-.72],label:'OLLAMA'},       // left occipital — local model
  diagnostic:  {c:0xff8f6b,p:[   0,-.55,-.55],label:'DIAG'},         // cerebellum — coordination
  'clear-glass':{c:0x8fb6ff,p:[  0, .05,-1.0],label:'GLASS'},        // brainstem-out — the window
};
const sysOf=ev=>{
  const raw=(ev._system||ev.system||ev.source||String(ev.type||'').split('.')[0]||'').toLowerCase();
  if(SYSTEMS[raw])return raw;
  for(const k of Object.keys(SYSTEMS))if(raw.includes(k))return k;
  return 'orchestrator';
};

/* ══════════ three.js scene ══════════ */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x04080a,0.11);
const camera=new THREE.PerspectiveCamera(50,1,0.1,100);
let camR=4.6,camTheta=0.4,camPhi=1.25;
function placeCam(){
  camera.position.set(camR*Math.sin(camPhi)*Math.sin(camTheta),camR*Math.cos(camPhi),camR*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(0,0,0);
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();placeCam();

/* orbit — hand-rolled (r128 CDN core has no OrbitControls) */
let drag=false,px=0,py=0,userSpun=0;
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag)return;
  camTheta-=(e.clientX-px)*0.006; camPhi=Math.max(0.25,Math.min(2.85,camPhi-(e.clientY-py)*0.006));
  px=e.clientX;py=e.clientY;userSpun=performance.now();placeCam();
});
canvas.addEventListener('wheel',e=>{camR=Math.max(2.2,Math.min(9,camR+e.deltaY*0.003));placeCam();},{passive:true});

/* ── cortex point cloud — two hemispheres, folded ── */
const N=9000;
const pos=new Float32Array(N*3), base=new Float32Array(N*3), col=new Float32Array(N*3), rnd=new Float32Array(N);
const fold=(x,y,z)=>0.10*Math.sin(7*x+3*z)*Math.sin(6*y+2*x)+0.06*Math.sin(13*y+5*z)*Math.cos(9*x)+0.035*Math.sin(21*z+11*x);
for(let i=0;i<N;i++){
  // sample on unit sphere
  const u=Math.random()*2-1, t=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u);
  let x=s*Math.cos(t), y=u, z=s*Math.sin(t);
  // brain ellipsoid: wide (x), tall-ish (y), long (z); flatten base
  const r=1+fold(x,y,z);
  x*=1.05*r; y*=(0.82*r)*(y<-.3?0.92:1); z*=1.32*r;
  // longitudinal fissure — push hemispheres apart, deepen the gap on top
  const gap=0.09+(y>0? y*0.10 :0);
  x+= (x>=0? gap : -gap);
  pos[i*3]=base[i*3]=x; pos[i*3+1]=base[i*3+1]=y; pos[i*3+2]=base[i*3+2]=z;
  rnd[i]=Math.random();
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const pmat=new THREE.PointsMaterial({size:0.022,vertexColors:true,transparent:true,opacity:0.85,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
const brain=new THREE.Points(geo,pmat);
scene.add(brain);

/* ── system nuclei + labels ── */
const nuclei={};
function labelSprite(text,hex){
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const g=cv.getContext('2d');g.font='700 26px "Space Mono",monospace';g.textAlign='center';
  g.fillStyle='#'+hex.toString(16).padStart(6,'0');g.globalAlpha=.9;g.fillText(text,128,40);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
  sp.scale.set(.72,.18,1);return sp;
}
for(const[id,s]of Object.entries(SYSTEMS)){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,16),
    new THREE.MeshBasicMaterial({color:s.c,transparent:true,opacity:0.9}));
  m.position.set(...s.p);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),
    new THREE.MeshBasicMaterial({color:s.c,transparent:true,opacity:0.18,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.add(halo);
  const lbl=labelSprite(s.label,s.c);lbl.position.y=0.16;m.add(lbl);
  m.userData={id,seat:new THREE.Vector3(...s.p),flash:0,online:null,halo,lbl};
  brain.add(m);nuclei[id]=m;
}
/* click nucleus → focus */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
canvas.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(Object.values(nuclei),false)[0];
  if(hit){fire(hit.object.userData.id);addEv({type:`ui.focus.${hit.object.userData.id}`,_system:hit.object.userData.id,ts:Date.now()});}
});

/* ── anchored edge graph — the real NEXUS topology, not random lines ──
   §anchored 2026-07-05: fires used to draw a one-shot line from a nucleus
   to a RANDOM particle's unscaled base position — endpoints matched no
   rendered geometry and no real data path, so edges appeared to fly
   around untethered. These are the actual seams: who talks to whom.     */
const EDGES=[
  ['orchestrator','cortex'],['orchestrator','guardian'],['orchestrator','bridge'],
  ['orchestrator','idearium'],['orchestrator','diagnostic'],
  ['guardian','cortex'],      // event forward — _toCortex
  ['guardian','ollama'],      // sovereign bridge dispatch
  ['idearium','guardian'],    // spec submit → /command
  ['copilot','cortex'],       // intuition / context reads
  ['copilot','guardian'],     // RAID-gated dispatch
  ['copilot','bridge'],       // tv-shell path
  ['bridge','clear-glass'],
  ['loom','guardian'],
  ['architect','cortex'],
  ['eravos','bridge'],
  ['diagnostic','cortex'],
];
const edgeObjs=[];
for(const[a,b]of EDGES){
  if(!nuclei[a]||!nuclei[b])continue;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({
    color:0x2a5a50,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false}));
  l.userData={a,b,glow:0};
  brain.add(l);edgeObjs.push(l);
}
const edgesOf={};for(const e of edgeObjs){(edgesOf[e.userData.a]??=[]).push(e);(edgesOf[e.userData.b]??=[]).push(e);}

/* ── pulse pool — a spark travels ALONG an anchored edge, a→b ── */
const PULSES=[];const pulsePool=[];
for(let i=0;i<32;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.022,8,8),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  brain.add(m);pulsePool.push(m);
}
function fire(sysId){
  const nuc=nuclei[sysId];if(!nuc)return;
  nuc.userData.flash=1;
  const es=edgesOf[sysId];if(!es||!es.length)return;
  const edge=es[Math.random()*es.length|0];
  edge.userData.glow=1;
  const m=pulsePool.find(p=>!p.userData.live);if(!m)return;
  // travel outward from the system that fired, toward its neighbor
  const from=edge.userData.a===sysId?edge.userData.a:edge.userData.b;
  const to  =edge.userData.a===sysId?edge.userData.b:edge.userData.a;
  m.material.color.setHex(SYSTEMS[sysId].c);
  m.userData={live:true,t0:performance.now(),from,to,edge};
  PULSES.push(m);
}

/* ══════════ CFR → visual state ══════════ */
const field={coherence:.6,friction:.2,resonance:.3,entropy:.2,tension:.1,regime:'stable',updatedAt:0};
const vis={coherence:.6,friction:.2,resonance:.3,entropy:.2,tension:.1};   // lerped
const REGIME_HUE={stable:[0x00ff88,'var(--green)','rgba(0,255,136,.35)'],
  elevated:[0xffaa00,'var(--amber)','rgba(255,170,0,.35)'],
  watch:[0xffaa00,'var(--amber)','rgba(255,170,0,.35)'],
  critical:[0xff3355,'var(--red)','rgba(255,51,85,.4)'],
  chaotic:[0xff3355,'var(--red)','rgba(255,51,85,.4)']};
let regimeColor=new THREE.Color(0x00ff88);

async function pollField(){
  try{
    const f=await j(`${CX}/cfr/field`);
    for(const k of['coherence','friction','resonance','entropy','tension'])if(typeof f[k]==='number')field[k]=f[k];
    field.regime=f.regime||'stable';field.updatedAt=f.updatedAt||f.ts||Date.now();
    renderCFR(true);
  }catch(_){renderCFR(false);}
}
function renderCFR(ok){
  const el=document.getElementById('cfr-body');
  const rows=[['coherence','var(--green)'],['tension','var(--red)'],['entropy','var(--amber)'],['friction','var(--cyan)'],['resonance','var(--violet)']];
  el.innerHTML=rows.map(([k,c])=>`<div class="gauge"><div class="glbl"><span>${k}</span><b>${field[k].toFixed(2)}</b></div>
    <div class="gbar"><div class="gfill" style="width:${(field[k]*100).toFixed(0)}%;background:${c}"></div></div></div>`).join('');
  document.getElementById('cfr-ts').textContent=ok?new Date(field.updatedAt).toLocaleTimeString():'⚠ :3748 unreachable';
  const R=REGIME_HUE[field.regime]||REGIME_HUE.stable;
  const badge=document.getElementById('regime');
  badge.textContent=field.regime.toUpperCase();badge.style.color=R[1];badge.style.borderColor=R[2];
  regimeColor.setHex(R[0]);
}
setInterval(pollField,2000);pollField();

/* ══════════ health chips + nucleus online state ══════════ */
async function pollStatus(){
  try{
    const s=await j(`${ORCH}/api/status`);
    const chips=document.getElementById('chips');chips.innerHTML='';
    for(const[id,d]of Object.entries(s.systems||{})){
      const c=document.createElement('span');c.className='chip '+(d.online?'on':'off');
      c.innerHTML=`<span class="dot"></span>${esc(id)}`;c.title=`${id} :${d.port} · ${d.ms}ms`;
      chips.appendChild(c);
      if(nuclei[id])nuclei[id].userData.online=!!d.online;
    }
  }catch(_){
    const chips=document.getElementById('chips');
    chips.innerHTML='<span class="chip off"><span class="dot"></span>orchestrator :9000 unreachable</span>';
  }
}
setInterval(pollStatus,6000);pollStatus();

/* ══════════ SSE — live events → stream panel + synapse fire ══════════ */
let es=null,_attempts=0,_stableTimer=null;
function connectSSE(){
  try{es=new EventSource(`${ORCH}/sse`);}catch(_){return scheduleReconnect();}
  es.onopen=()=>{
    document.getElementById('ssest').textContent='● live';
    // §backoff: only reset attempts after 10s of stability — a connect-then-
    // drop flicker must not reset the ladder (the flapping-storm lesson).
    clearTimeout(_stableTimer);
    _stableTimer=setTimeout(()=>{_attempts=0;},10000);
  };
  es.onerror=()=>{clearTimeout(_stableTimer);es.close();scheduleReconnect();};
  es.onmessage=m=>{
    let ev;try{ev=JSON.parse(m.data);}catch(_){return;}
    addEv(ev);fire(sysOf(ev));
  };
}
function scheduleReconnect(){
  _attempts++;
  const delay=Math.min(3000*Math.pow(2,_attempts-1),30000);
  document.getElementById('ssest').textContent=`retry ${delay/1000}s (attempt ${_attempts})`;
  setTimeout(connectSSE,delay);
}
const evs=document.getElementById('evs');let evCount=0;
function addEv(ev){
  const sys=sysOf(ev),c=SYSTEMS[sys]?.c||0x7aa898;
  const d=document.createElement('div');d.className='ev';
  d.innerHTML=`<span class="ts">${new Date(ev.ts||ev._ts||Date.now()).toLocaleTimeString()}</span>
    <span class="src" style="color:#${c.toString(16).padStart(6,'0')}">${esc(sys)}</span>
    <span class="ty">${esc(ev.type||'?')}</span>`;
  evs.prepend(d);
  if(++evCount>150)evs.lastChild?.remove();
}
connectSSE();

/* ══════════ animation loop — the brain breathes the field ══════════ */
const tmp=new THREE.Color();
let last=performance.now(),beat=0;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-last)/1000,0.1);last=now;

  // lerp visual field toward polled field — the brain shifts, never snaps
  for(const k of Object.keys(vis))vis[k]+=(field[k]-vis[k])*Math.min(1,dt*1.5);

  // heartbeat: rate from coherence, depth from resonance
  beat+=dt*(0.6+vis.coherence*1.6)*Math.PI*2;
  const pulse=1+Math.sin(beat)*(0.012+vis.resonance*0.03);

  // rotation: slow orbit, dragged down by friction, paused briefly after user input
  if(now-userSpun>2500){camTheta+=dt*0.07*(1-vis.friction*0.85);placeCam();}

  // particles: jitter = tension, scatter = entropy, color = regime blend
  const jit=vis.tension*0.035, sc=1+vis.entropy*0.16;
  const t=now*0.001;
  for(let i=0;i<N;i++){
    const i3=i*3,r=rnd[i];
    pos[i3]  =base[i3]  *sc*pulse+Math.sin(t*3.1+r*40)*jit*r;
    pos[i3+1]=base[i3+1]*sc*pulse+Math.sin(t*2.7+r*55)*jit;
    pos[i3+2]=base[i3+2]*sc*pulse+Math.cos(t*3.4+r*30)*jit*r;
    // color: regime hue, luminance from coherence, shimmer from resonance
    const lum=0.25+vis.coherence*0.55+Math.sin(t*2+r*90)*vis.resonance*0.15;
    tmp.copy(regimeColor).multiplyScalar(Math.max(0.05,lum*(0.6+r*0.6)));
    col[i3]=tmp.r;col[i3+1]=tmp.g;col[i3+2]=tmp.b;
  }
  geo.attributes.position.needsUpdate=true;
  geo.attributes.color.needsUpdate=true;

  // nuclei: BREATHE WITH THE TISSUE — same sc*pulse the cloud uses, so a
  // nucleus stays seated in its region instead of the cloud drifting
  // around a fixed point (§anchored 2026-07-05). Then flash/online/bob.
  const nscale=sc*pulse;
  for(const nuc of Object.values(nuclei)){
    const u=nuc.userData;
    nuc.position.copy(u.seat).multiplyScalar(nscale);
    u.flash=Math.max(0,u.flash-dt*2.2);
    const on=u.online!==false;
    nuc.material.opacity=(on?0.65:0.12)+u.flash*0.35;
    u.halo.material.opacity=(on?0.14:0.03)+u.flash*0.45;
    u.halo.scale.setScalar(1+u.flash*1.6+Math.sin(beat+nuc.position.x*7)*0.06);
    u.lbl.material.opacity=on?0.85:0.25;
  }

  // edges: re-anchor both endpoints to the CURRENT nucleus positions every
  // frame — they can never detach, whatever the field does. Glow decays.
  for(const e of edgeObjs){
    const A=nuclei[e.userData.a].position,B=nuclei[e.userData.b].position;
    const p=e.geometry.attributes.position.array;
    p[0]=A.x;p[1]=A.y;p[2]=A.z;p[3]=B.x;p[4]=B.y;p[5]=B.z;
    e.geometry.attributes.position.needsUpdate=true;
    e.userData.glow=Math.max(0,e.userData.glow-dt*1.4);
    e.material.opacity=0.10+vis.resonance*0.10+e.userData.glow*0.55;
  }

  // ambient synapse firing from resonance
  if(Math.random()<vis.resonance*dt*6){
    const ids=Object.keys(SYSTEMS);fire(ids[Math.random()*ids.length|0]);
  }
  // pulse lifecycle — spark lerps along its (re-anchored) edge, a→b
  for(let i=PULSES.length-1;i>=0;i--){
    const m=PULSES[i],age=(now-m.userData.t0)/650;
    if(age>=1){m.material.opacity=0;m.userData.live=false;PULSES.splice(i,1);continue;}
    const A=nuclei[m.userData.from].position,B=nuclei[m.userData.to].position;
    m.position.lerpVectors(A,B,age);
    m.material.opacity=age<0.2?age*4:(1-age)*0.9;
    m.scale.setScalar(1+Math.sin(age*Math.PI)*0.8);
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
