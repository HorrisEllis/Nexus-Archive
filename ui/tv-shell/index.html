<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS</title>
<link rel="stylesheet" href="../themes/nexus-dark.css">
<link rel="stylesheet" href="./tv-shell.css">
</head>
<body>

<!-- Layer 0: particle void — pure decoration, owned entirely by shell.js -->
<canvas id="void"></canvas>

<!-- Layer 1: the current channel. One iframe, swapped on tune() — the
     channel's own page is sovereign and knows nothing about this shell. -->
<div id="screen-wrap">
  <iframe id="screen" title="channel" referrerpolicy="no-referrer"></iframe>
</div>

<!-- Layer 2: HUD — channel indicator + menu button. Nothing here reaches
     into a channel; nothing in a channel reaches into this. -->
<div id="hud">
  <div id="channel-indicator">
    <span id="ci-num">--</span>
    <span id="ci-name">NO SIGNAL</span>
  </div>

  <button id="menu-btn" aria-label="Channels" aria-expanded="false">
    <span id="menu-btn-num">--</span>
    <span>CHANNELS</span>
  </button>

  <nav id="channel-rail" hidden></nav>
</div>

<script src="./shell.js"></script>
</body>
</html>
