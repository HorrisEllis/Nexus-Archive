id: guardian-ui-agent-chatgpt-v1
version: 1.0.0
namespace: guardian.ui.agents.chatgpt
seam_id: guardian.ui.agents.chatgpt:v1:index
comp_id: ChatGPTAgentPanel
contract_id: guardian-ui-agent-contract-v1
author: james-brooks-nexus

role: >
  Dashboard seam for the ChatGPT agent. Surfaces both dispatch modes
  (NCP browser bridge and direct OpenAI API) as one panel, without
  merging their state — each mode reports independently.

# ── Dispatch modes ────────────────────────────────────────────────────────────
# Mirrors guardian/api-dispatch.js's PROVIDERS.chatgpt (API) and the NCP
# hub now implemented at guardian/ncp/server.js. The hub itself was missing
# from the archive (only client-side callers existed) — it's rebuilt as of
# this revision, with /command routed through guardian/ncp/dispatch-pipeline.js
# (warp Event/Gate/Axiom/Stream + unifiedDispatch). No chatgpt.com userscript
# ships yet — that's still open — but the hub it would connect to is real.
dispatch_modes:
  ncp:
    description: Browser-tab bridge for chatgpt.com / chat.openai.com
    transport: http://127.0.0.1:7820
    channel: http://127.0.0.1:7820/channel
    command: http://127.0.0.1:7820/command
    result: http://127.0.0.1:7820/result
    heartbeat: http://127.0.0.1:7820/heartbeat
    match:
      - "https://chatgpt.com/*"
      - "https://chat.openai.com/*"
    status_when_absent: idle   # no heartbeat means the tab is closed, not an error
    cors: allowlist-only        # never '*' — see guardian/ncp/server.js §CORS
    bind: 127.0.0.1             # NCP_ALLOW_LAN=1 required to opt into 0.0.0.0
    dispatch_pipeline: guardian/ncp/dispatch-pipeline.js   # warp-based; see warp_integration below
  api:
    description: Direct OpenAI REST dispatch
    handler: guardian/api-dispatch.js#PROVIDERS.chatgpt
    base: api.openai.com
    path: /v1/chat/completions
    key_env: OPENAI_API_KEY
    model_env: OPENAI_MODEL
    default_model: gpt-4o-mini
    strengths: [token_efficiency, grounded, hostile_testing, structured_output]

# ── Upstream seams this panel reads from ─────────────────────────────────────
upstream_seams:
  - id: cortex-v1
    transport: http://127.0.0.1:3748
    consumes: [/health, /api/events, /api/gaps, /api/intelligence/status]
  - id: orchestrator-v1
    transport: http://127.0.0.1:9000
    consumes: [/health, /api/registry, /api/recall]

# ── Data sources (read-only) ──────────────────────────────────────────────────
data_sources:
  sessions:
    path: guardian/memory_store/seam_sessions.json
    filter: provider == "chatgpt"
  chat_log: guardian/memory_store/chat_log.json
  artifacts: guardian/memory_store/artifacts.json

axioms:
  - "This seam reads only — it never writes to memory_store directly"
  - "NCP and API dispatch modes are reported separately, never merged into one status"
  - "Absence of a live NCP heartbeat is 'idle', not 'error'"

# ── warp integration ──────────────────────────────────────────────────────────
# guardian/ncp/dispatch-pipeline.js is the first real consumer of warp/
# (previously a standalone, unused devkit). It wraps the /command round-trip
# in warp's unifiedDispatch instead of a bespoke per-provider path.
warp_integration:
  module: guardian/ncp/dispatch-pipeline.js
  gate: ncp.command.dispatch
  gate_class_prefix: "ncp.<provider>"
  axioms:
    - id: ncp.origin-allowlist
      severity: hard
      enforces: "provider must be a known seam AND (no origin, i.e. server-issued) OR origin on that provider's allowlist"
    - id: ncp.no-secret-egress
      severity: hard
      enforces: "reject prompts that look like they're forwarding a live API key/token"
    - id: ncp.privacy-retention
      severity: soft
      enforces: "flags PII-shaped content for redaction before persistence — does not block dispatch"
  crystallizer: FlatFileCrystallizer @ guardian/memory_store/ncp_dispatch_cache.json
  effect: "identical (provider, prompt) pairs promote to warp's exact-cache after 3 repeats at fitness >= 0.7 — repeat browser round-trips stop entirely from that point on"

privacy:
  redaction: guardian/ncp/dispatch-pipeline.js#redact()  # email / phone / apikey / ssn-like patterns
  retention_ms_default: 1209600000  # 14 days
  lan_exposure: "guardian/memory_store/settings.json's lan_host default (0.0.0.0) is NOT inherited by the NCP hub — see guardian/ncp/server.js header"

ui:
  entry: index.html
  refresh_ms: 4000
  fields:
    - seam_id
    - provider
    - mode
    - connState
    - sessionsActive
    - sessionsComplete
    - escalated
    - lastHeartbeat
