<!DOCTYPE html>
<html lang="en">
<!--
  ui/channels/build/build.html — sovereign channel per DECOMP.md's own
  design goal: "each channel can be opened independently in a browser
  tab for debugging." This is the primary channel — the closed loop
  from any .spec file to a real build, fronting emerge/compiler/
  t2-gate.js's run() via lib/build-pipeline.js.
-->
<head>
  <meta charset="utf-8" />
  <title>NEXUS — Build</title>
  <link rel="stylesheet" href="/ui/toast/toast.css" />
  <link rel="stylesheet" href="build.css" />
</head>
<body>
  <main class="build-page">
    <header class="build-page__header">
      <h1>Build Pipeline</h1>
      <p class="build-page__subtitle">.spec &rarr; KnowledgeGraph &rarr; tier decide &rarr; T0/T1 emit &rarr; T2 dispatch &rarr; verify &rarr; disk</p>
    </header>

    <section class="build-form">
      <label>
        .spec file path
        <input id="build-spec-path" type="text" placeholder="/path/to/component.spec" />
      </label>
      <label>
        output directory <span class="build-form__optional">(optional)</span>
        <input id="build-output-dir" type="text" placeholder="defaults next to the .spec" />
      </label>
      <label>
        provider
        <select id="build-provider">
          <option value="ollama" selected>ollama (local, LAW_I)</option>
          <option value="chatgpt">chatgpt</option>
          <option value="claude">claude</option>
        </select>
      </label>
      <label class="build-form__checkbox">
        <input type="checkbox" id="build-full-pipeline" checked />
        Full pipeline (build &rarr; isolated verify &rarr; compare vs golden &rarr; promote/rollback)
      </label>
      <div class="build-form__buttons">
        <button id="build-start-btn" class="build-form__submit">Build</button>
        <button id="build-auto-btn" class="build-form__submit build-form__submit--auto" title="Copilot decides how, you don't have to type anything else">Let Copilot handle it</button>
      </div>
    </section>

    <section class="build-status hidden" id="build-status-section">
      <div class="build-status__head">
        <span id="build-status-badge" class="build-status__badge">started</span>
        <code id="build-status-id"></code>
      </div>
      <div id="build-node-grid" class="build-node-grid"></div>
    </section>

    <section class="build-history">
      <h2>Recent builds</h2>
      <ul id="build-history-list" class="build-history__list"></ul>
    </section>
  </main>

  <script src="/ui/toast/toast.js"></script>
  <script src="build.js"></script>
</body>
</html>
