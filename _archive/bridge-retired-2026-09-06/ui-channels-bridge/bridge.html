<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS · BRIDGE</title>
<link rel="stylesheet" href="/ui/home/home.css">
<style>
  /* §SOVEREIGN CHANNEL 2026-07-11 — this channel is a standalone document,
     openable and testable on its own (DECOMP.md benefit #3). It reuses
     home.css for design tokens + existing component classes (.sys-tile,
     .ch, etc.) rather than forking them, so it always matches the shell's
     look without duplicating hundreds of class definitions. */
  html,body{margin:0;padding:0;background:transparent;color:var(--text,#e8eef7);font-family:'Space Grotesk',sans-serif;height:100%}
  .ch{display:block!important;position:static!important;width:100%;height:100%;animation:none!important}
  .channel-root{padding:16px;height:100%;box-sizing:border-box;overflow:auto}
</style>
</head>
<body>
<div class="channel-root">
<div class="ch" id="ch-bridge">
    <div class="stat-row" id="br-stats">
      <div class="stat-box"><div class="stat-v" id="br-reqs">—</div><div class="stat-l">Requests</div></div>
      <div class="stat-box"><div class="stat-v" id="br-nodes">—</div><div class="stat-l">Nodes</div></div>
      <div class="stat-box"><div class="stat-v" id="br-health">—</div><div class="stat-l">Health</div></div>
      <div class="stat-box"><div class="stat-v" id="br-uptime">—</div><div class="stat-l">Uptime</div></div>
    </div>
    <div class="gd-box" style="flex:1;min-height:0">
      <div class="box-head">Registry <button class="btn" style="font-size:9px;padding:3px 7px" onclick="brLoad()">↺</button></div>
      <div class="box-body" id="br-reg"></div>
    </div>
  </div>
</div>
<script src="/ui/lib/api.js"></script>
<script>
'use strict';
// §API base ports — same map home/index.html uses (P{...}), duplicated
// here on purpose: a sovereign channel must not depend on the shell's
// global scope existing (it may be opened standalone, per DECOMP.md).
const P={orch:9000,gd:7820,cx:3748,br:9999,idr:4800,em:4242,arch:3747,dg:7825};
const B={orch:`http://127.0.0.1:${P.orch}`,gd:`http://127.0.0.1:${P.gd}`,cx:`http://127.0.0.1:${P.cx}`,br:`http://127.0.0.1:${P.br}`,idr:`http://127.0.0.1:${P.idr}`,em:`http://127.0.0.1:${P.em}`,arch:`http://127.0.0.1:${P.arch}`,dg:`http://127.0.0.1:${P.dg}`};

async function brLoad(){
  const h=await get(`${B.br}/health`);
  if(h){document.getElementById('br-reqs').textContent=h.requests??'—';document.getElementById('br-nodes').textContent=h.nodes??'—';document.getElementById('br-health').textContent=h.ok?'OK':'DEGRADED';document.getElementById('br-health').style.color=h.ok?'#00ff88':'#ff3355';document.getElementById('br-uptime').textContent=h.uptimeMs?Math.floor(h.uptimeMs/60000)+'m':'—'}
  const reg=await get(`${B.br}/api/registry`);const el=document.getElementById('br-reg');
  const nodes=Array.isArray(reg)?reg:(reg?.nodes||[]);
  if(!nodes.length){el.innerHTML='<div style="color:rgba(255,255,255,.2);font-size:11px">No registered nodes</div>';return}
  el.innerHTML=nodes.map(n=>`<div class="node-row"><span class="node-id">${n.id||n.name||'node'}</span><span class="node-url">${n.url||n.address||''}</span><span class="node-st ${n.online||n.healthy?'up':'down'}">${n.online||n.healthy?'● online':'● offline'}</span></div>`).join('');
}

// ── init ──────────────────────────────────────────────────────────────────
try { brLoad(); } catch(e) { console.warn('[channel:bridge] init failed:', e.message); }

// ── this channel's own SSE subscription — sovereign, not dependent on the
//    shell's single connection (matches DECOMP.md's "each channel can be
//    opened independently... for debugging"). Shell-embedded use can still
//    layer postMessage on top later without this needing to change. ──────
try {
  const es = new EventSource(`${B.orch}/sse`);
  es.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (typeof window.onChannelEvent === 'function') window.onChannelEvent(d);
    } catch(_) {}
  };
  es.onerror = () => { /* orchestrator not reachable — channel still renders, just static until it is */ };
} catch(_) {}
</script>
</body>
</html>
